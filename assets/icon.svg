<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Rowtation</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9D9DE"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <g filter="url(#shadow)" transform="translate(-150 -197) scale(1.25)">
      <rect x="300" y="610" width="460" height="104" rx="52" fill="#AEAEB2" transform="rotate(-28 300 700)"/>
      <rect x="300" y="610" width="460" height="104" rx="52" fill="#636366" transform="rotate(-14 300 700)"/>
      <rect x="300" y="610" width="460" height="104" rx="52" fill="#1C1C1E"/>
      <circle cx="352" cy="662" r="22" fill="#F5F5F7"/>
    </g>
    <rect width="1024" height="1024" fill="url(#gloss)"/>
  </g>
  <rect x="2" y="2" width="1020" height="1020" rx="226" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>
</svg>
