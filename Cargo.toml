[package]
name = "nsh-app-rowtation"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
csv = "1.4.0"
hashbrown = { version = "0.17.1", default-features = false }
rustc-hash = "2.1.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window", "Document", "HtmlElement", "HtmlInputElement", "Element", "Event", "EventTarget", "File", "FileList", "DragEvent", "DataTransfer", "Node", "DomException", "Blob", "Performance"] }
