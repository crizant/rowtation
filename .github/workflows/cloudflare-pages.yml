name: Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and test web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install web build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang llvm
          rustup toolchain install stable --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default stable
          echo "RUST_CACHE_VERSION=$(rustc --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies and builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: web-${{ runner.os }}-${{ env.RUST_CACHE_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            web-${{ runner.os }}-${{ env.RUST_CACHE_VERSION }}-

      - name: Install NSH 0.4.0
        env:
          NSH_VERSION: v0.4.0
        run: |
          curl --fail --location --retry 3 https://github.com/longbridge/nsh/releases/download/v0.4.0/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check and test
        run: |
          nsh --version
          cargo fmt --check
          nsh check
          nsh build
          nsh test
          nsh test --target web --browser /usr/bin/google-chrome

      - name: Package static website
        run: |
          nsh package --target web -o dist
          test -f dist/Rowtation/index.html

      - name: Save website artifact
        uses: actions/upload-artifact@v7
        with:
          name: rowtation-web
          path: dist/Rowtation/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    needs: build
    if: vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "Missing CLOUDFLARE_PAGES_PROJECT repository variable"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/download-artifact@v8
        with:
          name: rowtation-web
          path: site

      - name: Upload to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
